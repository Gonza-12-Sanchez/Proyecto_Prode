# [DATABASE] alembic.ini - Configuración Alembic para el proyecto Prode.
# Ubicación: database/alembic.ini
# Responsabilidad: Capa DATABASE - Define script_location y conexión asyncpg. Se ejecuta via `alembic -c database/alembic.ini upgrade head`.
# Usa: database/alembic/env.py, database.connection.Base
# No hace: No crea tablas directamente, delega en env.py y versions/.

# Alembic placeholder for Prode MVP
# Run: alembic -c database/alembic.ini upgrade head
# Configured for async PostgreSQL + asyncpg. See database/alembic/env.py for URL from settings.

[alembic]
script_location = database/alembic
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/quiniela

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
